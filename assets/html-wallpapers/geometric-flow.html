<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何流动动态壁纸</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #06080f;
  }
  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 700px at 30% 30%, rgba(40, 20, 80, 0.2), transparent 65%),
      radial-gradient(800px 600px at 70% 60%, rgba(20, 40, 80, 0.18), transparent 60%),
      linear-gradient(150deg, #06080f 0%, #0a0d1a 50%, #080c16 100%);
  }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: true });
  var W = 0, H = 0, DPR = 1;
  var rafId = null;
  var running = true;
  var time = 0;
  var triangles = [];

  var GRID_SIZE = 70;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function seed() {
    triangles = [];
    var cols = Math.ceil(W / GRID_SIZE) + 2;
    var rows = Math.ceil(H / GRID_SIZE) + 2;

    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var cx = col * GRID_SIZE - GRID_SIZE / 2;
        var cy = row * GRID_SIZE - GRID_SIZE / 2;

        // 创建两个三角形构成菱形
        var tri1 = {
          cx: cx + GRID_SIZE / 2, cy: cy,
          points: [
            { x: cx, y: cy },
            { x: cx + GRID_SIZE, y: cy },
            { x: cx + GRID_SIZE / 2, y: cy + GRID_SIZE }
          ],
          hue: 220 + Math.random() * 80,
          offsetX: Math.random() * 2 - 1,
          offsetY: Math.random() * 2 - 1,
          speed: Math.random() * 0.3 + 0.1
        };
        var tri2 = {
          cx: cx + GRID_SIZE / 2, cy: cy + GRID_SIZE,
          points: [
            { x: cx, y: cy },
            { x: cx + GRID_SIZE / 2, y: cy + GRID_SIZE },
            { x: cx, y: cy + GRID_SIZE }
          ],
          hue: 220 + Math.random() * 80,
          offsetX: Math.random() * 2 - 1,
          offsetY: Math.random() * 2 - 1,
          speed: Math.random() * 0.3 + 0.1
        };

        triangles.push(tri1, tri2);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var centerX = W / 2;
    var centerY = H / 2;

    for (var i = 0; i < triangles.length; i++) {
      var tri = triangles[i];
      var dx = tri.cx - centerX;
      var dy = tri.cy - centerY;
      var dist = Math.sqrt(dx * dx + dy * dy);

      // 流动位移
      var flowX = Math.sin(time * 0.001 * tri.speed + dy * 0.01) * 8;
      var flowY = Math.cos(time * 0.001 * tri.speed + dx * 0.01) * 8;

      // 旋转
      var angle = Math.sin(time * 0.0005 + dist * 0.003) * 0.1;
      var cos = Math.cos(angle);
      var sin = Math.sin(angle);

      var pts = [];
      for (var j = 0; j < tri.points.length; j++) {
        var px = tri.points[j].x - tri.cx;
        var py = tri.points[j].y - tri.cy;
        var rx = px * cos - py * sin;
        var ry = px * sin + py * cos;
        pts.push({
          x: tri.cx + rx + flowX,
          y: tri.cy + ry + flowY
        });
      }

      // 跳过屏幕外的三角形
      var allOut = true;
      for (var k = 0; k < pts.length; k++) {
        if (pts[k].x > -GRID_SIZE && pts[k].x < W + GRID_SIZE &&
            pts[k].y > -GRID_SIZE && pts[k].y < H + GRID_SIZE) {
          allOut = false;
          break;
        }
      }
      if (allOut) continue;

      // 颜色随时间漂移
      var hue = (tri.hue + Math.sin(time * 0.0003 + i * 0.1) * 40) % 360;
      var alpha = 0.08 + Math.abs(Math.sin(time * 0.0008 + dist * 0.004)) * 0.06;

      // 填充三角形
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.closePath();
      ctx.fillStyle = 'hsla(' + hue + ', 60%, 50%, ' + alpha.toFixed(4) + ')';
      ctx.fill();

      // 描边
      ctx.strokeStyle = 'hsla(' + hue + ', 80%, 65%, ' + (alpha * 2.5).toFixed(4) + ')';
      ctx.lineWidth = 0.5;
      ctx.shadowColor = 'hsla(' + hue + ', 90%, 60%, 0.3)';
      ctx.shadowBlur = 4;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 绘制连接线
    ctx.strokeStyle = 'rgba(100, 150, 220, 0.04)';
    ctx.lineWidth = 0.3;
    for (var i = 0; i < triangles.length; i += 6) {
      var t = triangles[i];
      var nextI = (i + 1) % triangles.length;
      var nt = triangles[nextI];
      var ddx = t.cx - nt.cx;
      var ddy = t.cy - nt.cy;
      if (ddx * ddx + ddy * ddy < GRID_SIZE * GRID_SIZE * 4) {
        ctx.beginPath();
        ctx.moveTo(t.cx + Math.sin(time * 0.001 * t.speed) * 5, t.cy + Math.cos(time * 0.001 * t.speed) * 5);
        ctx.lineTo(nt.cx + Math.sin(time * 0.001 * nt.speed) * 5, nt.cy + Math.cos(time * 0.001 * nt.speed) * 5);
        ctx.stroke();
      }
    }
  }

  function step(timestamp) {
    time = timestamp;
    draw();
    rafId = requestAnimationFrame(step);
  }

  function start() {
    if (rafId === null && running) rafId = requestAnimationFrame(step);
  }

  function stop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) start(); else stop();
  });

  resize();
  start();
})();
</script>
</body>
</html>
