<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星空银河动态壁纸</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #030812;
  }
  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(800px 500px at 20% 20%, rgba(30, 60, 130, 0.28), transparent 60%),
      radial-gradient(600px 400px at 75% 65%, rgba(80, 40, 140, 0.22), transparent 58%),
      radial-gradient(900px 600px at 50% 40%, rgba(10, 30, 80, 0.18), transparent 70%),
      linear-gradient(160deg, #030812 0%, #0A1530 40%, #0C0A28 100%);
  }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: true });
  var W = 0, H = 0, DPR = 1;
  var stars = [];
  var meteors = [];
  var rafId = null;
  var running = true;
  var lastTime = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function seed() {
    var count = Math.min(400, Math.max(200, Math.round((W * H) / 8000)));
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 2 + 0.5,
        phase: Math.random() * Math.PI * 2,
        period: Math.random() * 3 + 1.5,
        baseAlpha: Math.random() * 0.5 + 0.5,
        twinkleSpeed: Math.random() * 0.02 + 0.005
      });
    }
    meteors = [];
  }

  function spawnMeteor() {
    var angle = Math.random() * 0.5 + 0.25;
    var startX = Math.random() * W * 0.8;
    var startY = Math.random() * H * 0.3;
    var speed = Math.random() * 6 + 8;
    meteors.push({
      x: startX, y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.008 + 0.012,
      length: Math.random() * 60 + 40
    });
  }

  function update(dt) {
    // 随机生成流星
    if (Math.random() < 0.008) spawnMeteor();

    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life -= m.decay;
      if (m.life <= 0) meteors.splice(i, 1);
    }
  }

  function draw(time) {
    ctx.clearRect(0, 0, W, H);

    // 绘制星星
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = s.baseAlpha + Math.sin(time * s.twinkleSpeed + s.phase) * 0.35;
      alpha = Math.max(0.15, Math.min(1, alpha));

      // 亮星加辉光
      if (s.r > 1.4 && alpha > 0.7) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180, 210, 255, ' + (alpha * 0.12) + ')';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      var hue = 200 + (s.y / H) * 40;
      ctx.fillStyle = 'hsla(' + hue + ', 60%, 85%, ' + alpha.toFixed(3) + ')';
      ctx.fill();
    }

    // 绘制流星
    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];
      var tailX = m.x - m.vx * 2;
      var tailY = m.y - m.vy * 2;
      var endX = m.x - (m.vx / Math.sqrt(m.vx * m.vx + m.vy * m.vy)) * m.length;
      var endY = m.y - (m.vy / Math.sqrt(m.vx * m.vx + m.vy * m.vy)) * m.length;

      var grad = ctx.createLinearGradient(m.x, m.y, endX, endY);
      grad.addColorStop(0, 'rgba(255, 255, 255, ' + m.life.toFixed(3) + ')');
      grad.addColorStop(0.3, 'rgba(180, 210, 255, ' + (m.life * 0.7).toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(80, 140, 220, 0)');

      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(endX, endY);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5 * m.life;
      ctx.stroke();

      // 头部光点
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2.5 * m.life, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (m.life * 0.9).toFixed(3) + ')';
      ctx.fill();
    }
  }

  function step(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var dt = Math.min(timestamp - lastTime, 50);
    lastTime = timestamp;

    update(dt);
    draw(timestamp * 0.001);
    rafId = requestAnimationFrame(step);
  }

  function start() {
    if (rafId === null && running) {
      lastTime = 0;
      rafId = requestAnimationFrame(step);
    }
  }

  function stop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) start(); else stop();
  });

  resize();
  start();
})();
</script>
</body>
</html>
