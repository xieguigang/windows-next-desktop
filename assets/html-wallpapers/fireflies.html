<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萤火虫森林动态壁纸</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #020a04;
  }
  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(800px 600px at 30% 70%, rgba(10, 30, 15, 0.35), transparent 65%),
      radial-gradient(700px 500px at 70% 40%, rgba(8, 20, 10, 0.3), transparent 60%),
      radial-gradient(900px 700px at 50% 50%, rgba(5, 15, 8, 0.25), transparent 70%),
      linear-gradient(180deg, #020a04 0%, #041208 30%, #030d06 60%, #020804 100%);
  }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: true });
  var W = 0, H = 0, DPR = 1;
  var fireflies = [];
  var rafId = null;
  var running = true;
  var time = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function seed() {
    var count = Math.min(80, Math.max(40, Math.round((W * H) / 18000)));
    fireflies = [];
    for (var i = 0; i < count; i++) {
      fireflies.push({
        x: Math.random() * W,
        y: Math.random() * H,
        baseX: Math.random() * W,
        baseY: Math.random() * H,
        radius: Math.random() * 60 + 30,
        speed: Math.random() * 0.003 + 0.001,
        phase: Math.random() * Math.PI * 2,
        glowSize: Math.random() * 15 + 8,
        glowAlpha: Math.random() * 0.4 + 0.3,
        flickerSpeed: Math.random() * 0.04 + 0.015,
        flickerPhase: Math.random() * Math.PI * 2,
        hue: Math.random() * 20 + 55
      });
    }
  }

  function drawFirefly(ff, time) {
    // 呼吸闪烁
    var flicker = 0.5 + 0.5 * Math.sin(time * ff.flickerSpeed + ff.flickerPhase);
    flicker = flicker * flicker;
    var alpha = ff.glowAlpha * (0.6 + 0.4 * flicker);

    if (alpha < 0.03) return;

    // 外层大光晕
    var outerGrad = ctx.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.glowSize * 2.5);
    outerGrad.addColorStop(0, 'hsla(' + ff.hue + ', 100%, 70%, ' + (alpha * 0.5) + ')');
    outerGrad.addColorStop(0.3, 'hsla(' + ff.hue + ', 100%, 55%, ' + (alpha * 0.2) + ')');
    outerGrad.addColorStop(1, 'hsla(' + ff.hue + ', 100%, 50%, 0)');

    ctx.beginPath();
    ctx.arc(ff.x, ff.y, ff.glowSize * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = outerGrad;
    ctx.fill();

    // 中层光晕
    var midGrad = ctx.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.glowSize * 1.2);
    midGrad.addColorStop(0, 'hsla(' + ff.hue + ', 80%, 80%, ' + (alpha * 0.8) + ')');
    midGrad.addColorStop(0.5, 'hsla(' + ff.hue + ', 100%, 60%, ' + (alpha * 0.4) + ')');
    midGrad.addColorStop(1, 'hsla(' + ff.hue + ', 100%, 50%, 0)');

    ctx.beginPath();
    ctx.arc(ff.x, ff.y, ff.glowSize * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = midGrad;
    ctx.fill();

    // 内层核心
    var innerGrad = ctx.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.glowSize * 0.3);
    innerGrad.addColorStop(0, 'rgba(255, 255, 255, ' + (alpha * 1.2) + ')');
    innerGrad.addColorStop(0.3, 'hsla(' + ff.hue + ', 100%, 85%, ' + (alpha * 0.9) + ')');
    innerGrad.addColorStop(1, 'hsla(' + ff.hue + ', 100%, 60%, 0)');

    ctx.beginPath();
    ctx.arc(ff.x, ff.y, ff.glowSize * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = innerGrad;
    ctx.fill();
  }

  function update(time) {
    for (var i = 0; i < fireflies.length; i++) {
      var ff = fireflies[i];

      // 绕基点飘动
      ff.x = ff.baseX + Math.sin(time * ff.speed + ff.phase) * ff.radius;
      ff.y = ff.baseY + Math.cos(time * ff.speed * 1.3 + ff.phase) * ff.radius * 0.8;

      // 缓慢漂移基点
      ff.baseX += Math.sin(time * 0.0003 + ff.phase * 2) * 0.15;
      ff.baseY += Math.cos(time * 0.0004 + ff.phase * 1.5) * 0.12;

      // 边界约束
      if (ff.baseX < -ff.radius) ff.baseX += W + ff.radius * 2;
      if (ff.baseX > W + ff.radius) ff.baseX -= W + ff.radius * 2;
      if (ff.baseY < -ff.radius * 0.8) ff.baseY += H + ff.radius * 1.6;
      if (ff.baseY > H + ff.radius * 0.8) ff.baseY -= H + ff.radius * 1.6;
    }
  }

  function drawBackgroundGrass() {
    // 绘制一些暗色的草叶轮廓
    ctx.strokeStyle = 'rgba(5, 20, 8, 0.3)';
    ctx.lineWidth = 1;

    var seed = 42;
    for (var i = 0; i < 40; i++) {
      var gx = ((Math.sin(seed + i * 137.5) * 10000 + 10000) % 10000) / 10000 * W;
      var gy = H - ((Math.cos(seed + i * 271.8) * 10000 + 10000) % 10000) / 10000 * H * 0.35;

      var sway = Math.sin(time * 0.0005 + gx * 0.02) * 5;

      ctx.beginPath();
      ctx.moveTo(gx, gy + 60);
      ctx.quadraticCurveTo(gx + sway, gy + 30, gx + sway * 2, gy);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(gx + 8, gy + 70);
      ctx.quadraticCurveTo(gx + 8 + sway * 1.2, gy + 35, gx + 8 + sway * 2.5, gy + 5);
      ctx.stroke();
    }
  }

  function step(timestamp) {
    time = timestamp;
    ctx.clearRect(0, 0, W, H);

    update(time);
    drawBackgroundGrass();

    // 按亮度排序，亮的后画
    fireflies.sort(function (a, b) {
      var fa = 0.5 + 0.5 * Math.sin(time * a.flickerSpeed + a.flickerPhase);
      var fb = 0.5 + 0.5 * Math.sin(time * b.flickerSpeed + b.flickerPhase);
      return fa * a.glowAlpha - fb * b.glowAlpha;
    });

    for (var i = 0; i < fireflies.length; i++) {
      drawFirefly(fireflies[i], time);
    }

    // 暗角效果
    var vignetteGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vignetteGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vignetteGrad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);

    rafId = requestAnimationFrame(step);
  }

  function start() {
    if (rafId === null && running) rafId = requestAnimationFrame(step);
  }

  function stop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) start(); else stop();
  });

  resize();
  start();
})();
</script>
</body>
</html>
