<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮动气泡动态壁纸</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
  }
  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1000px 800px at 40% 50%, rgba(20, 30, 80, 0.3), transparent 60%),
      radial-gradient(800px 600px at 60% 30%, rgba(40, 20, 70, 0.2), transparent 55%),
      linear-gradient(180deg, #0a0e1a 0%, #0d1228 40%, #0a0e1a 100%);
  }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: true });
  var W = 0, H = 0, DPR = 1;
  var bubbles = [];
  var rafId = null;
  var running = true;
  var time = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function seed() {
    var count = Math.min(100, Math.max(60, Math.round((W * H) / 12000)));
    bubbles = [];
    for (var i = 0; i < count; i++) {
      bubbles.push(createBubble(Math.random() * H));
    }
  }

  function createBubble(startY) {
    return {
      x: Math.random() * W,
      y: startY || H + Math.random() * 50,
      r: Math.random() * 20 + 5,
      speed: Math.random() * 0.5 + 0.3,
      wobbleAmp: Math.random() * 1.5 + 0.5,
      wobbleFreq: Math.random() * 0.02 + 0.008,
      wobblePhase: Math.random() * Math.PI * 2,
      hue: Math.random() * 60 + 180,
      alpha: Math.random() * 0.15 + 0.06,
      growthRate: Math.random() * 0.02 + 0.005
    };
  }

  function drawBubble(b) {
    // 外发光
    var glowGrad = ctx.createRadialGradient(b.x, b.y, b.r * 0.6, b.x, b.y, b.r * 1.5);
    glowGrad.addColorStop(0, 'hsla(' + b.hue + ', 60%, 70%, ' + (b.alpha * 0.3) + ')');
    glowGrad.addColorStop(1, 'hsla(' + b.hue + ', 60%, 70%, 0)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // 气泡主体渐变
    var bodyGrad = ctx.createRadialGradient(
      b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.05,
      b.x, b.y, b.r
    );
    bodyGrad.addColorStop(0, 'rgba(255, 255, 255, ' + (b.alpha * 2) + ')');
    bodyGrad.addColorStop(0.15, 'hsla(' + b.hue + ', 50%, 75%, ' + (b.alpha * 1.2) + ')');
    bodyGrad.addColorStop(0.5, 'hsla(' + b.hue + ', 40%, 55%, ' + (b.alpha * 0.8) + ')');
    bodyGrad.addColorStop(1, 'hsla(' + b.hue + ', 30%, 40%, ' + (b.alpha * 0.3) + ')');

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();

    // 边框
    ctx.strokeStyle = 'hsla(' + b.hue + ', 50%, 80%, ' + (b.alpha * 1.5) + ')';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // 高光点
    var hlGrad = ctx.createRadialGradient(
      b.x - b.r * 0.3, b.y - b.r * 0.35, 0,
      b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.3
    );
    hlGrad.addColorStop(0, 'rgba(255, 255, 255, ' + (b.alpha * 3) + ')');
    hlGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = hlGrad;
    ctx.fill();
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];

      // 上升
      b.y -= b.speed;

      // 水平摆动
      b.x += Math.sin(time * b.wobbleFreq + b.wobblePhase) * b.wobbleAmp;

      // 大小微变
      b.r += b.growthRate;
      if (b.r > 22 || b.r < 5) b.growthRate *= -1;

      // 边界回绕
      if (b.x < -b.r) b.x = W + b.r;
      if (b.x > W + b.r) b.x = -b.r;

      // 到达顶部后重置到底部
      if (b.y < -b.r * 2) {
        bubbles[i] = createBubble(H + b.r * 2);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 按半径排序实现远近效果
    bubbles.sort(function (a, b) { return a.r - b.r; });

    for (var i = 0; i < bubbles.length; i++) {
      drawBubble(bubbles[i]);
    }
  }

  function step(timestamp) {
    time = timestamp;
    update();
    draw();
    rafId = requestAnimationFrame(step);
  }

  function start() {
    if (rafId === null && running) rafId = requestAnimationFrame(step);
  }

  function stop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) start(); else stop();
  });

  resize();
  start();
})();
</script>
</body>
</html>
