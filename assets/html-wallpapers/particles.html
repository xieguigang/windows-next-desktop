<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子动态壁纸</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070B18;
  }
  #bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1100px 760px at 16% 14%, rgba(76, 194, 255, 0.22), transparent 62%),
      radial-gradient(920px 700px at 84% 80%, rgba(168, 85, 247, 0.24), transparent 60%),
      linear-gradient(140deg, #070B18 0%, #101A3A 48%, #1B1038 100%);
  }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: true });

  var W = 0, H = 0, DPR = 1;
  var particles = [];
  var mouse = { x: -9999, y: -9999 };
  var rafId = null;
  var running = true;

  var LINK_DIST = 132;
  var MOUSE_DIST = 190;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function seed() {
    // 粒子数量随屏幕面积自适应，并设上限防止低端设备卡顿
    var target = Math.min(140, Math.max(40, Math.round((W * H) / 15000)));
    particles = [];
    for (var i = 0; i < target; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.34,
        vy: (Math.random() - 0.5) * 0.34,
        r: Math.random() * 1.6 + 0.9,
        hue: 190 + Math.random() * 80
      });
    }
  }

  function step() {
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -20) p.x = W + 20;
      else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20;
      else if (p.y > H + 20) p.y = -20;

      // 鼠标轻微排斥
      var mdx = p.x - mouse.x;
      var mdy = p.y - mouse.y;
      var md2 = mdx * mdx + mdy * mdy;
      if (md2 < MOUSE_DIST * MOUSE_DIST && md2 > 1) {
        var md = Math.sqrt(md2);
        var force = (1 - md / MOUSE_DIST) * 0.55;
        p.x += (mdx / md) * force;
        p.y += (mdy / md) * force;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 92%, 74%, 0.82)';
      ctx.fill();
    }

    // 邻近连线
    for (var a = 0; a < particles.length; a++) {
      for (var b = a + 1; b < particles.length; b++) {
        var pa = particles[a], pb = particles[b];
        var dx = pa.x - pb.x, dy = pa.y - pb.y;
        var d2 = dx * dx + dy * dy;
        if (d2 > LINK_DIST * LINK_DIST) continue;
        var alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.32;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.strokeStyle = 'rgba(140, 200, 255, ' + alpha.toFixed(3) + ')';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }

    rafId = requestAnimationFrame(step);
  }

  function start() {
    if (rafId === null && running) rafId = requestAnimationFrame(step);
  }

  function stop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('pointerleave', function () {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  // 页面不可见时停止渲染，省电
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) start(); else stop();
  });

  resize();
  start();
})();
</script>
</body>
</html>
